<!-- Template para Supabase → Authentication → Email Templates:
     use o MESMO conteúdo em "Magic Link" e em "Confirm signup".
     Assunto sugerido: Seu código de acesso — App Maratona 21 -->
<div style="background:#F6F0E6;padding:32px 16px;font-family:Arial,Helvetica,sans-serif;color:#14100D">
  <div style="max-width:520px;margin:0 auto;background:#FBF8F2;border-radius:16px;padding:32px">
    <p style="font-size:13px;letter-spacing:2px;color:#B4642F;text-transform:uppercase;margin:0">Maratona 21</p>
    <h1 style="font-family:Georgia,serif;font-size:24px;margin:12px 0 0">Seu código de acesso</h1>
    <p style="font-size:17px;line-height:1.6">Digite este código no app para entrar:</p>
    <p style="font-size:36px;font-weight:bold;letter-spacing:8px;margin:8px 0 24px">{{ .Token }}</p>
    <p style="font-size:15px;line-height:1.6;color:#5E5248">Ou toque no botão abaixo (abra no mesmo aparelho em que pediu o código):</p>
    <p><a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email"
          style="display:inline-block;background:#14100D;color:#F6F0E6;text-decoration:none;padding:14px 24px;border-radius:12px;font-weight:bold">ENTRAR NO APP</a></p>
    <p style="font-size:13px;color:#8A7B6C;margin-top:24px">Se você não pediu este código, ignore este e-mail.</p>
  </div>
</div>
